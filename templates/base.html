<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Excellent Store{% endblock %} — Toko Produk Digital</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a href="{{ url_for('index') }}" style="display:flex;align-items:center;gap:12px">
      <img class="logo" src="{{ url_for('static', filename='logo.jpg') }}" alt="Excellent Store">
      <span class="brand">EXCELLENT STORE<small>DIGITAL PRODUCT</small></span>
    </a>
    <span class="spacer"></span>
    <a class="iconbtn" href="{{ url_for('lacak') }}" title="Lacak pesanan">🔍</a>
    <a class="iconbtn" href="{{ url_for('keranjang') }}" title="Keranjang">🛒
      {% if cart_n %}<span class="badge">{{ cart_n }}</span>{% endif %}
    </a>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer>
  <div class="wrap">
    👑 Excellent Store — produk digital original, pengiriman otomatis.<br>
    Pembayaran: QRIS • E-Wallet • Bank • Binance Pay
  </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
